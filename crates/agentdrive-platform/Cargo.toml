[package]
name = "agentdrive-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
agentdrive-model.workspace = true
agentdrive-ports.workspace = true
async-trait.workspace = true
bytes.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true

cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
libc.workspace = true
uuid.workspace = true

[features]
macos-mount = ["dep:fuser", "dep:nix"]
macos-fuse-t = ["macos-mount", "fuser/fuse-t"]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18.0"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.30", features = ["mount"], optional = true }
fuser = { version = "0.18.0", optional = true }

[target.'cfg(windows)'.dependencies]
winfsp_wrs = "0.4.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
agentdrive-config.workspace = true
agentdrive-engine.workspace = true
agentdrive-local.workspace = true
agentdrive-test-support.workspace = true

[build-dependencies]
pkg-config = "0.3"
